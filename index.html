<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARETE 카드뉴스 에디터</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --stage:#1b1a18; --panel:#25231f; --panel2:#2e2c27; --line:#3c3931;
  --ink:#eae6dd; --dim:#989286; --sel:#5bc8af; --warn:#e0925c;
  --ui:-apple-system,"Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
/* hidden 속성은 브라우저 기본 스타일(display:none)이라 아래 .picker{display:grid} 같은
   작성자 규칙에 밀린다. 그러면 hidden 을 걸어도 안 사라진다 — 반드시 이 줄이 있어야 한다 */
[hidden]{display:none!important}
html{height:100%}
body{height:100dvh;min-height:520px;margin:0}
body{font-family:var(--ui);background:var(--stage);color:var(--ink);font-size:13px;
  overflow:hidden;display:grid;grid-template-rows:auto auto 1fr}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#454136;border-radius:9px}
.topbar{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--panel);
  border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.15em;font-size:12px;color:var(--sel)}
.brand i{font-style:normal;color:var(--dim);font-weight:500;letter-spacing:.02em;margin-left:8px}
#projName{background:transparent;border:1px solid transparent;border-radius:5px;padding:4px 7px;min-width:180px}
#projName:hover{border-color:var(--line)}
#projName:focus{outline:none;border-color:var(--sel);background:var(--panel2)}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 11px}
.btn:hover{border-color:#5b5648}
.btn.pri{background:var(--sel);border-color:var(--sel);color:#0f2019;font-weight:600}
.btn.ghost{background:transparent}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.wrap{display:grid;grid-template-columns:198px 1fr 286px;min-height:0}
.rail{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.rail.left{border-right:1px solid var(--line)}
.rail.right{border-left:1px solid var(--line)}
.rail h3{margin:0;padding:11px 13px 6px;font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.05em}
.rail .scroll{overflow-y:auto;padding:0 11px 16px;min-height:0}
.railfoot{border-top:1px solid var(--line);padding:9px 11px;display:grid;gap:6px}
.thumb{position:relative;width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden;
  border:2px solid var(--line);background:#111;margin-bottom:7px;cursor:pointer;display:block;padding:0}
.thumb.on{border-color:var(--sel)}
.thumb .num{position:absolute;left:4px;top:4px;z-index:2;background:rgba(0,0,0,.6);color:#fff;
  border-radius:4px;font-size:10px;padding:1px 5px}
.thumb .inner{position:absolute;inset:0;transform-origin:top left;pointer-events:none}
.cardtools{display:flex;gap:4px;margin:-2px 0 11px}
.cardtools button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:5px;
  padding:3px 0;font-size:11px;color:var(--dim)}
.cardtools button:hover{color:var(--ink)}
.stagewrap{display:flex;flex-direction:column;min-width:0;min-height:0;
  background:linear-gradient(0deg,rgba(0,0,0,.22),rgba(0,0,0,.22)),
    repeating-conic-gradient(#222120 0 25%,#1b1a18 0 50%) 0 0/22px 22px}
.stagebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px;
  border-bottom:1px solid var(--line);background:rgba(27,26,24,.7)}
.stagebar .sep{width:1px;height:17px;background:var(--line);margin:0 3px}
.chip{background:transparent;border:1px solid var(--line);border-radius:5px;padding:4px 9px;color:var(--dim)}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--panel2);color:var(--sel);border-color:var(--sel)}
.stage{flex:1;display:grid;place-items:center;overflow:auto;padding:24px;min-height:0}
.canvas{position:relative;overflow:hidden;transform-origin:center center;
  background:#fff;flex:none;box-shadow:0 10px 44px rgba(0,0,0,.5)}
.bgl{position:absolute;inset:0}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.el{position:absolute;user-select:none}
.el .txt{width:100%;height:100%;display:flex;flex-direction:column;white-space:pre-wrap;word-break:keep-all}
.el img{width:100%;height:100%;display:block}
.hl{box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:.02em .1em}
.chrome{position:absolute;inset:0;pointer-events:none}
.selbox{position:absolute;border:1.5px solid var(--sel)}
.hdl{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--sel);
  border-radius:3px;pointer-events:auto}
.guide{position:absolute;background:var(--warn)}
.safe{position:absolute;border:1px dashed rgba(91,200,175,.45)}
.field{margin:0 0 9px}
.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:3px}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;
  background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px 7px}
.field textarea{min-height:78px;resize:vertical;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sel)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
input[type=color]{width:100%;height:28px;padding:1px;background:var(--panel2);border:1px solid var(--line);
  border-radius:5px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--sel)}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{flex:1;background:var(--panel2);border:0;padding:5px 0;color:var(--dim);font-size:12px}
.seg button.on{background:var(--sel);color:#0f2019;font-weight:600}
.hint{color:var(--dim);line-height:1.6;font-size:11.5px}
.divider{height:1px;background:var(--line);margin:13px 0}
.preset{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:7px 9px;margin-bottom:6px;line-height:1.35}
.preset:hover{border-color:var(--sel)}
.preset b{display:block;font-weight:600;font-size:12px}
.preset i{font-style:normal;color:var(--dim);font-size:11px}
.swatchrow{display:flex;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:5px 7px;margin-bottom:5px}
.sw{width:22px;height:22px;border-radius:5px;flex:none;border:1px solid rgba(255,255,255,.18)}
.swatchrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.swatchrow .hx{color:var(--dim);font-size:10.5px;font-variant-numeric:tabular-nums}
.swatchrow button{background:none;border:0;color:var(--dim);padding:0 2px}
.swatchrow button:hover{color:var(--warn)}
.results{max-height:210px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;margin-top:5px}
.results button{display:flex;gap:7px;align-items:center;width:100%;background:none;border:0;
  padding:4px 7px;text-align:left;border-bottom:1px solid rgba(255,255,255,.04)}
.results button:hover{background:var(--panel2)}
.results .sw{width:17px;height:17px}
.roles{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0 4px}
.roles div{text-align:center;font-size:10px;color:var(--dim)}
.roles i{display:block;height:26px;border-radius:5px;margin-bottom:3px;border:1px solid rgba(255,255,255,.15)}
.badgewarn{color:var(--warn);font-size:11px;line-height:1.55;margin:4px 0 0}
.bar{display:flex;gap:9px;align-items:center;padding:8px 14px;background:#3a3427;
  border-bottom:1px solid var(--line);font-size:12px;color:#f0e6cf}
.bar .spacer{flex:1}
.picker{position:fixed;inset:0;background:rgba(12,11,10,.82);display:grid;place-items:center;z-index:60}
.pbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;
  width:min(460px,88vw);max-height:76vh;overflow:auto}
.pbox h2{margin:0 0 4px;font-size:16px}
.pbox p{margin:0 0 14px;color:var(--dim);font-size:12px;line-height:1.6}
.pbox a.item{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:7px;
  padding:9px 11px;margin-bottom:6px;text-decoration:none;color:var(--ink)}
.pbox a.item:hover{border-color:var(--sel)}
.pbox a.item small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--sel);border-radius:7px;padding:8px 15px;opacity:0;transition:opacity .18s;
  pointer-events:none;z-index:99;max-width:70vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="topbar">
  <span class="brand">ARETE<i>카드뉴스 에디터</i></span>
  <input id="projName" value="제목 없는 카드뉴스">
  <span class="spacer"></span>
  <button class="btn ghost" id="btnFonts">폰트 폴더 불러오기</button>
  <button class="btn ghost" id="btnShare">공유 링크 복사</button>
  <button class="btn ghost" id="btnImport">JSON 불러오기</button>
  <button class="btn ghost" id="btnExportJson">JSON 내보내기</button>
  <button class="btn" id="btnPngOne">이 카드 PNG</button>
  <button class="btn pri" id="btnPngAll">전체 PNG</button>
</div>

<div class="bar" id="bar" hidden></div>

<div class="wrap">
  <aside class="rail left">
    <h3>카드</h3>
    <div class="scroll" id="cardList"></div>
    <div class="railfoot"><button class="btn" id="btnAddCard">카드 추가</button></div>
  </aside>

  <section class="stagewrap">
    <div class="stagebar">
      <button class="chip" data-add="text">＋ 텍스트</button>
      <button class="chip" data-add="shape">＋ 도형</button>
      <button class="chip" data-add="image">＋ 이미지</button>

      <button class="chip" data-align="hc">가로 중앙</button>
      <button class="chip" data-align="vc">세로 중앙</button>

        <button data-z="fit">맞춤</button><button data-z="50">50%</button>
        <button data-z="75">75%</button><button data-z="100">100%</button></div>
      <span class="hint" id="zoomLabel" style="min-width:132px;text-align:right"></span>
    </div>
    <div class="stage" id="stage"><div class="canvas" id="canvas"></div></div>

  <aside class="rail right">
    <h3 id="rightTitle">속성</h3>
    <div class="scroll" id="inspector"></div>
  </aside>
</div>

<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="jsonPick" accept="application/json,.json" hidden>
<input type="file" id="fontPick" webkitdirectory directory multiple hidden>
<div class="picker" id="picker" hidden></div>

<script>
/* ============ 네이밍 색 데이터 ============ */
const NAMED = (function(){
  const raw = "burnham:002923|sherwood:014D2F|mint water:0B674E|calanque:17666D|zeus:1D1814|rhino:2A4161|boston blue:4194A2|danube:549BCE|red earth:68230D|eminence:723277|olive:8CA231|red cognac:992A17|hippie pink:A2465F|fun green:007A39|sea green:02774B|deep black:0E0906|olympic blue:1899D3|astronaut:253368|antracite:333333|mercure:4E698E|pesto:647C32|rosewood:6B2220|uranus:72BDBB|turkish red:8F1919|sepia skin:9B5F41|blizzard:A3D9F2|pine green:007A70|cod grey:0A0A0A|ebony blue:14162F|atlantique:1B526A|aqua:26C3EC|picton blue:36BDE7|asparagus:525F4E|mineral grey:658080|turquoise:70C5CA|cornflower:8A8FF8|cumin:924727|provence:9FAE94|amethyst:A452A7|red violet:A71680|green gold:ABA76F|amethyst haze:B6ACC4|milano red:BD1E01|silver:C2C2C2|chartreuse:CBEE88|yuma beige:CFBF9B|indian sun:DEC63D|swiss coffee:E2DDD7|tulip tree:E6A737|flamingo:EB5E31|vanilla ice:EFCAD6|creemy peach:F5CCBE|anise:A8CC8C|baby blue:ACCAF0|old brick:BA2320|pluton:BEDBD8|almond:C6B7A4|thunderbird:CD1F1D|electric lilac:D3B5FF|imperial:DEC63E|oyster pink:E3CCC4|amaranth:E72267|tango:EB6A26|azalea:F2B7C9|ivory:F5F5E9|steel grey:AAA9A9|heliotropium:B032EB|pirate gold:BC7700|french lilac:C29ECA|burnt orange:C77440|hibiscus:CE306A|spritz:D74322|laser lemon:E2DA56|mercury:E5E5E5|soft butter:EAD29A|carissma:ED87AD|parchment:F3E7D9|yellow sea:F9A801|cherokee:FDD596|tangerine:FF9855|milk punch:FFF4D6";
  return raw.split("|").map(s => { const i = s.lastIndexOf(":"); return { n: s.slice(0,i), h: "#"+s.slice(i+1) }; });
})();

/* ============ 유틸 ============ */
let W=1080, H=1350;
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const hex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
function lum(h){const c=rgb(h).map(v=>v/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));
  return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function ratio(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
function sat(h){const [r,g,b]=rgb(h).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  return mx===0?0:(mx-mn)/mx;}
function mix(a,b,t){const A=rgb(a),B=rgb(b);return hex(A.map((v,i)=>v+(B[i]-v)*t));}
const onColor=(bg,a,b)=>ratio(bg,a)>=ratio(bg,b)?a:b;

/* ============ 폰트 ============ */
const FAMS=['Pretendard','SUIT','Paperlogy','GmarketSans','MBK','NotoSerifKR','CormorantGaramond'];
// 드롭다운에 보일 이름. 브랜드 서체는 어디에 쓰는 것인지 붙여 둔다
const FLABEL={NotoSerifKR:'Noto Serif KR — 브랜드 본문(명조)',
              CormorantGaramond:'Cormorant Garamond — 브랜드 라틴',
              GmarketSans:'Gmarket Sans'};
const FALLBACK="'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
const loaded={};            // family -> Set(weights)
const loadedNames=[];       // 배포용 목록
const WMAP=[['thin',100],['extralight',200],['ultralight',200],['light',300],['regular',400],['normal',400],
  ['medium',500],['semibold',600],['demibold',600],['extrabold',800],['ultrabold',800],['heavy',900],
  ['black',900],['bold',700]];
function famOf(fn){
  const s=fn.toLowerCase().replace(/[^a-z0-9]/g,'');
  if(s.includes('gmarket'))return 'GmarketSans';
  if(s.includes('pretendard'))return 'Pretendard';
  if(s.includes('paperlogy'))return 'Paperlogy';
  if(s.includes('suit'))return 'SUIT';
  if(s.includes('mbk'))return 'MBK';
  if(s.includes('notoserif'))return 'NotoSerifKR';
  if(s.includes('cormorant'))return 'CormorantGaramond';
  return null;
}
function weightOf(fn){
  const s=fn.toLowerCase().replace(/[^a-z0-9]/g,'');
  const m=s.match(/(100|200|300|400|500|600|700|800|900)/); if(m)return +m[1];
  for(const [k,v] of WMAP) if(s.includes(k)) return v;
  return 400;
}
async function loadFontFiles(files){
  let ok=0;
  for(const f of files){
    if(!/\.(ttf|otf|woff2?)$/i.test(f.name))continue;
    const fam=famOf(f.name); if(!fam)continue;
    try{
      const buf=await f.arrayBuffer();
      const w=weightOf(f.name), it=/italic|oblique/i.test(f.name)?'italic':'normal';
      const ff=new FontFace(fam,buf,{weight:String(w),style:it,display:'swap'});
      await ff.load(); document.fonts.add(ff);
      (loaded[fam]=loaded[fam]||new Set()).add(w); loadedNames.push(f.name); ok++;
    }catch(e){}
  }
  return ok;
}
const stack=f=>`'${f}',${FALLBACK}`;

/* ============ 로고 ============
   assets/logo-arete.png 는 **알파 마스크**다 — 모양만 있고 색은 없다.
   그래서 팔레트 색을 입혀 쓴다. 색깔별로 한 번만 만들어 캐시한다. */
const LOGO_SRC='assets/logo-arete.png';
const LOGO_DEF={x:80,b:56,h:78,role:'ink',op:.28};
let LOGO_IMG=null;
const logoCache={};
function initLogo(){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{LOGO_IMG=im;res(true);};
    im.onerror=()=>res(false);          // 없어도 에디터는 돌아가야 한다
    im.src=LOGO_SRC;
  });
}
function logoTinted(color){
  if(!LOGO_IMG)return '';
  if(logoCache[color])return logoCache[color];
  const cv=document.createElement('canvas');
  cv.width=LOGO_IMG.naturalWidth; cv.height=LOGO_IMG.naturalHeight;
  const g=cv.getContext('2d');
  g.drawImage(LOGO_IMG,0,0);
  g.globalCompositeOperation='source-in';   // 알파는 두고 색만 채운다
  g.fillStyle=color; g.fillRect(0,0,cv.width,cv.height);
  try{ return logoCache[color]=cv.toDataURL('image/png'); }catch(e){ return ''; }
}
async function loadFontManifest(){
  let list=null;
  try{ const m=await getJSON('assets/fonts/index.json'); list=Array.isArray(m)?m:(m.files||[]); }
  catch{ return 0; }
  // **등록만 하고 내려받지 않는다.** FontFace 에 url() 을 주면 브라우저가
  // 그 글꼴이 실제로 화면에 쓰이는 순간에 받는다.
  // 여기서 load() 를 기다리면 30개 넘는 파일(16MB)을 다 받고서야 첫 화면이 뜬다.
  let ok=0;
  for(const fn of list){
    const fam=famOf(fn); if(!fam)continue;
    const w=weightOf(fn), it=/italic|oblique/i.test(fn)?'italic':'normal';
    try{
      const ff=new FontFace(fam,`url(assets/fonts/${encodeURIComponent(fn)})`,
        {weight:String(w),style:it,display:'swap'});
      document.fonts.add(ff);                       // load() 를 부르지 않는다 = 지연 로딩
      (loaded[fam]=loaded[fam]||new Set()).add(w); ok++;
    }catch(e){}
  }
  return ok;
}
function weightsFor(fam){
  const s=loaded[fam]; const arr=s?[...s].sort((a,b)=>a-b):[300,400,500,600,700,800,900];
  return arr;
}

/* ============ 상태 ============ */
let project=blank(), cur=0, selId=null, scale=1, showSafe=true;

function blank(){
  return {v:3, name:'제목 없는 카드뉴스', size:{w:1080,h:1350},
    theme:{ picks:[{n:'antracite',h:'#333333'},{n:'laser lemon',h:'#E2DA56'},{n:'ivory',h:'#F5F5E9'}],
      dark:false, font:'Pretendard' },
    frame:{ label:'칼럼', header:true, footer:true, logo:'' },
    cards:[ preset('cover') ]};
}
function applySize(){W=project.size.w;H=project.size.h;}
const card=()=>project.cards[cur];
const sel=()=>card().els.find(e=>e.id===selId)||null;

/* ---- 팔레트 역할 배정 ---- */
function roles(){
  const t=project.theme, p=t.picks.length?t.picks.map(x=>x.h):['#f2f0e4','#28282d'];
  const byL=[...p].sort((a,b)=>lum(b)-lum(a));
  const bg = t.dark ? byL[byL.length-1] : byL[0];
  const ink = p.reduce((b,c)=>ratio(c,bg)>ratio(b,bg)?c:b, p[0]);
  const rest = p.filter(c=>c!==bg&&c!==ink);
  const hl = rest.slice().sort((a,b)=>sat(b)-sat(a))[0] || mix(ink,bg,.75);
  const accent = rest.find(c=>c!==hl) || hl;
  return { bg, ink, hl, accent,
    sub: mix(ink,bg,.48), line: mix(ink,bg,.82),
    onHl: onColor(hl, ink, bg) };
}

/* ============ 인라인 마크업 ============ */
function inline(s,R){
  return esc(s)
    .replace(/==([^=]+)==/g,`<span class="hl" style="background:${R.hl};color:${R.onHl}">$1</span>`)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
}
function colorOf(e,R){
  if(e.color)return e.color;
  return {ink:R.ink,sub:R.sub,accent:R.accent,line:R.line,onAccent:onColor(R.accent,R.ink,R.bg),bg:R.bg}[e.role]||R.ink;
}

/* ============ 렌더 ============ */
function paint(box,c,idx,total){
  const R=roles(), F=project.theme.font, fr=project.frame;
  let h=`<div class="bgl" style="background:${R.bg}"></div>`;
  if(c.bg.type==='image'&&c.bg.src){
    h+=`<img class="bgimg" src="${esc(c.bg.src)}" style="object-fit:${c.bg.fit}" crossorigin="anonymous">`;
    if(c.bg.tintA>0)h+=`<div class="bgl" style="background:${c.bg.tint};opacity:${c.bg.tintA}"></div>`;
  }
  if(fr.header){
    h+=`<div style="position:absolute;left:80px;top:52px;font:700 24px ${stack(F)};color:${R.ink}">${esc(fr.label)}</div>`;
    h+=`<div style="position:absolute;right:80px;top:52px;font:600 24px ${stack(F)};color:${R.ink};letter-spacing:.02em">${String(idx+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</div>`;
    h+=`<div style="position:absolute;left:80px;right:80px;top:98px;height:1px;background:${R.line}"></div>`;
  }
  if(fr.footer){
    if(fr.logoOn!==false){
      // 직접 넣은 이미지가 있으면 그것을, 없으면 기본 ARETE 로고에 팔레트 색을 입혀 쓴다
      const lsrc = fr.logo || logoTinted(R[fr.logoRole||LOGO_DEF.role]||R.ink);
      if(lsrc)h+=`<img src="${esc(lsrc)}" style="position:absolute;left:${fr.logoX??LOGO_DEF.x}px;`
        +`bottom:${fr.logoB??LOGO_DEF.b}px;height:${fr.logoH??LOGO_DEF.h}px;width:auto;`
        +`opacity:${fr.logoOp??LOGO_DEF.op}" crossorigin="anonymous">`;
    }
    h+=`<div style="position:absolute;right:80px;bottom:64px;display:flex;align-items:center;gap:9px;font:600 22px ${stack(F)};color:${R.sub}">
      <span style="width:9px;height:9px;border-radius:9px;background:${R.accent};display:block"></span>${String(idx+1).padStart(2,'0')}</div>`;
  }
  for(const e of c.els){
    const pos=`left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;opacity:${e.opacity};`;
    if(e.type==='text'){
      const st=`font-family:${stack(e.font||F)};font-size:${e.size}px;font-weight:${e.weight};`
        +`font-style:${e.italic?'italic':'normal'};line-height:${e.lh};letter-spacing:${e.ls}em;`
        +`color:${colorOf(e,R)};text-align:${e.align};`
        +`align-items:${e.align==='center'?'center':e.align==='right'?'flex-end':'flex-start'};`
        +`justify-content:${e.valign==='center'?'center':e.valign==='end'?'flex-end':'flex-start'};`;
      h+=`<div class="el" data-id="${e.id}" style="${pos}"><div class="txt" style="${st}"><span>${inline(e.text,R)}</span></div></div>`;
    }else if(e.type==='shape'){
      h+=`<div class="el" data-id="${e.id}" style="${pos}background:${e.fill||colorOf(e,R)};border-radius:${e.radius}px"></div>`;
    }else{
      h+=`<div class="el" data-id="${e.id}" style="${pos}overflow:hidden;border-radius:${e.radius}px">`
        +(e.src?`<img src="${esc(e.src)}" style="object-fit:${e.fit}" crossorigin="anonymous">`
          :`<div style="width:100%;height:100%;background:${mix(R.bg,R.ink,.12)};display:flex;align-items:center;justify-content:center;color:${R.sub};font:400 22px ${stack(F)}">이미지 없음</div>`)
        +`</div>`;
    }
  }
  box.innerHTML=h;
}

const HDL=[['nw',0,0],['n',.5,0],['ne',1,0],['e',1,.5],['se',1,1],['s',.5,1],['sw',0,1],['w',0,.5]];

      d.style.left=`calc(${fx*100}% - 6px)`;d.style.top=`calc(${fy*100}% - 6px)`;
      d.style.cursor=(k==='n'||k==='s')?'ns-resize':(k==='e'||k==='w')?'ew-resize':

let zoomMode='fit';
function fit(){
  const st=$('#stage'), cv=$('#canvas');
  const aw=st.clientWidth-50, ah=st.clientHeight-50;
  if(zoomMode==='fit'){
    if(aw<60||ah<60) return;               // 레이아웃 전 — 이전 배율 유지
    scale=Math.max(Math.min(aw/W,ah/H,1),.15);
  } else scale=+zoomMode/100;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cv.style.transform=`scale(${scale})`;
  cv.style.margin=`${(H*scale-H)/2}px ${(W*scale-W)/2}px`;
  $('#zoomLabel').textContent=`${W} × ${H} · ${Math.round(scale*100)}%`;
  $('#zoomSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.z===zoomMode));
  fitKey=`${st.clientWidth}x${st.clientHeight}|${zoomMode}|${W}x${H}`;
}
$('#zoomSeg').onclick=ev=>{const z=ev.target.dataset.z;if(!z)return;zoomMode=z;fit();};
let fitKey='';
new ResizeObserver(()=>requestAnimationFrame(()=>{
  const st=$('#stage'), k=`${st.clientWidth}x${st.clientHeight}|${zoomMode}|${W}x${H}`;
  if(k===fitKey)return; fitKey=k; fit();
})).observe($('#stage'));
requestAnimationFrame(()=>requestAnimationFrame(fit));
addEventListener('resize',fit);

function cardList(){
  const box=$('#cardList'); box.innerHTML='';
  project.cards.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='thumb'+(i===cur?' on':''); b.style.aspectRatio=W+'/'+H;
    b.innerHTML=`<span class="num">${i+1}</span><div class="inner"></div>`;
    const inner=b.querySelector('.inner');
    inner.style.width=W+'px';inner.style.height=H+'px';inner.style.transform=`scale(${172/W})`;
    paint(inner,c,i,project.cards.length);
    b.onclick=()=>{cur=i;selId=null;render();};
    box.appendChild(b);
    if(i===cur){
      const t=document.createElement('div');t.className='cardtools';
      t.innerHTML=`<button data-a="up">↑</button><button data-a="down">↓</button><button data-a="dup">복제</button><button data-a="del">삭제</button>`;
      t.onclick=ev=>{const a=ev.target.dataset.a;if(!a)return;
        if(a==='up'&&cur>0){sw(cur,cur-1);cur--;}
        if(a==='down'&&cur<project.cards.length-1){sw(cur,cur+1);cur++;}
        if(a==='dup'){const n=JSON.parse(JSON.stringify(card()));n.id=uid();n.els.forEach(e=>e.id=uid());
          project.cards.splice(cur+1,0,n);cur++;}
        if(a==='del'){if(project.cards.length===1)return toast('카드가 하나뿐이라 삭제할 수 없어요');
          project.cards.splice(cur,1);cur=Math.max(0,cur-1);}
        selId=null;render();};
      box.appendChild(t);
    }
  });
}

function bind(){
  const box=$('#inspector');
  box.querySelectorAll('[data-k]').forEach(inp=>{
    const k=inp.dataset.k, ev=(inp.type==='range')?'input':'change';
    inp.addEventListener(ev,()=>{
      const e=sel(); if(!e)return; let v=inp.value;
      if(['size','weight','x','y','w','h','radius'].includes(k))v=parseFloat(v)||0;
      if(['lh','ls','opacity'].includes(k))v=parseFloat(v);
      e[k]=v;
      if(inp.type==='range'||k==='text'){paint($('#canvas'),card(),cur,project.cards.length);chrome();cardList();save();}
      else render();
    });
    if(inp.type==='range')inp.addEventListener('change',render);
    if(k==='text')inp.addEventListener('input',()=>{const e=sel();if(!e)return;e.text=inp.value;
      paint($('#canvas'),card(),cur,project.cards.length);chrome();save();});
  });
  box.querySelectorAll('[data-bg]').forEach(inp=>inp.addEventListener(inp.type==='text'?'change':'input',()=>{
    card().bg[inp.dataset.bg]=inp.dataset.bg==='tintA'?parseFloat(inp.value):inp.value;
    paint($('#canvas'),card(),cur,project.cards.length);chrome();cardList();save();}));
  box.querySelectorAll('[data-fr]').forEach(inp=>inp.addEventListener('input',()=>{
    const k=inp.dataset.fr;
    if(k==='logoOp100')project.frame.logoOp=(+inp.value||28)/100;      // 슬라이더는 %, 저장은 0~1
    else if(/^logo(X|B|H)$/.test(k))project.frame[k]=+inp.value||0;    // 숫자로 저장한다
    else project.frame[k]=inp.value;
    paint($('#canvas'),card(),cur,project.cards.length);chrome();cardList();save();}));
  box.querySelectorAll('[data-th]').forEach(inp=>inp.addEventListener('change',()=>{project.theme[inp.dataset.th]=inp.value;render();}));
  box.querySelectorAll('[data-seg]').forEach(seg=>seg.addEventListener('click',ev=>{
    const v=ev.target.dataset.v; if(v===undefined)return; const key=seg.dataset.seg, e=sel();
    if(key==='bgtype')card().bg.type=v;
    else if(key==='ratio'){project.size={w:1080,h:v==='45'?1350:1080};applySize();}
    else if(key==='dark')project.theme.dark=v==='1';
    else if(key==='header'||key==='footer')project.frame[key]=v==='1';
    else if(key==='logoOn')project.frame.logoOn=v==='1';
    else if(key==='italic'&&e)e.italic=v==='1';
    else if(e)e[key]=v;
    render();}));
  box.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{
    const n=preset(b.dataset.preset);n.id=card().id;n.bg=card().bg;project.cards[cur]=n;selId=null;render();});
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{project.theme.picks.splice(+b.dataset.rm,1);render();});
  box.querySelectorAll('[data-add-color]').forEach(b=>b.onclick=()=>{
    if(project.theme.picks.length>=4)return toast('키 컬러는 4개까지만 — 하나 빼고 추가하세요');
    project.theme.picks.push({n:b.dataset.name,h:b.dataset.addColor});colorQuery='';render();});
  const cs=$('#colorSearch');
  if(cs){cs.oninput=()=>{colorQuery=cs.value;inspector();
    const n=$('#colorSearch');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}};}
  box.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
}

function act(a){
  const e=sel();
  if((a==='sz-'||a==='sz+')&&e){e.size=Math.max(8,e.size+(a==='sz+'?2:-2));render();}
  if(a==='clearcolor'&&e){e.color=null;render();}
  if(a==='freecolor'&&e){const i=document.createElement('input');i.type='color';
    i.value=e.color||colorOf(e,roles());i.oninput=()=>{e.color=i.value;
      paint($('#canvas'),card(),cur,project.cards.length);chrome();save();};
    i.onchange=()=>render();i.click();}
  if(a==='delel'&&e){card().els=card().els.filter(x=>x.id!==e.id);selId=null;render();}
  if(a==='dupel'&&e){const n=JSON.parse(JSON.stringify(e));n.id=uid();n.x+=24;n.y+=24;
    card().els.push(n);selId=n.id;render();}
  if(a==='fontman'){
    const b=new Blob([JSON.stringify([...new Set(loadedNames)].sort(),null,2)],{type:'application/json'});
    dl(URL.createObjectURL(b),'index.json');
    toast('index.json 저장됨 — 폰트 파일들과 함께 assets/fonts/ 에 올리세요');}
  if(a==='pickimg')pickImg(d=>{e.src=d;render();});
  if(a==='pickbg')pickImg(d=>{card().bg.src=d;card().bg.type='image';render();});
  if(a==='picklogo')pickImg(d=>{project.frame.logo=d;render();});
  if(a==='logoreset'){project.frame.logo='';render();toast('기본 ARETE 로고로 되돌렸어요');}
}
function pickImg(cb){const f=$('#filePick');f.value='';
  f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();
    r.onload=()=>cb(r.result);r.readAsDataURL(file);};f.click();}

let drag=null, guides=[];
$('#canvas').addEventListener('pointerdown',ev=>{
  const cv=$('#canvas'), hd=ev.target.closest('.hdl'), ed=ev.target.closest('.el');
  if(!hd&&!ed){selId=null;chrome();inspector();return;}
  if(ed&&ed.querySelector('[contenteditable=true]'))return;
  if(ed)selId=ed.dataset.id;
  const e=sel(); if(!e)return;
  ev.preventDefault(); cv.setPointerCapture(ev.pointerId);
  drag={mode:hd?'resize':'move',h:hd?.dataset.h,sx:ev.clientX,sy:ev.clientY,o:{x:e.x,y:e.y,w:e.w,h:e.h}};
  chrome(); inspector();
});
$('#canvas').addEventListener('pointermove',ev=>{
  if(!drag)return; const e=sel(); if(!e)return;
  const dx=(ev.clientX-drag.sx)/scale, dy=(ev.clientY-drag.sy)/scale, o=drag.o;
  if(drag.mode==='move'){e.x=o.x+dx;e.y=o.y+dy;snap(e,ev.shiftKey);}
  else{const k=drag.h;
    if(k.includes('e'))e.w=Math.max(16,o.w+dx);
    if(k.includes('s'))e.h=Math.max(16,o.h+dy);
    if(k.includes('w')){e.w=Math.max(16,o.w-dx);e.x=o.x+(o.w-e.w);}
    if(k.includes('n')){e.h=Math.max(16,o.h-dy);e.y=o.y+(o.h-e.h);}}
  paint($('#canvas'),card(),cur,project.cards.length); chrome(); drawGuides();
});
['pointerup','pointercancel'].forEach(t=>$('#canvas').addEventListener(t,()=>{
  if(!drag)return; drag=null; guides=[];
  const e=sel(); if(e){e.x=Math.round(e.x);e.y=Math.round(e.y);e.w=Math.round(e.w);e.h=Math.round(e.h);}
  render();}));
function snap(e,off){
  guides=[]; if(off)return; const TOL=9;
  const t=[{v:(W-e.w)/2,a:'x',l:W/2},{v:80,a:'x',l:80},{v:W-80-e.w,a:'x',l:W-80},
    {v:(H-e.h)/2,a:'y',l:H/2},{v:150,a:'y',l:150},{v:H-80-e.h,a:'y',l:H-80}];
  for(const g of t)if(Math.abs(e[g.a]-g.v)<TOL){e[g.a]=g.v;guides.push(g);}
}
function drawGuides(){
  const ch=$('#canvas').querySelector('.chrome'); if(!ch)return;
  for(const g of guides){const d=document.createElement('div');d.className='guide';
    d.style.cssText=g.a==='x'?`left:${g.l}px;top:0;width:1.5px;height:100%`:`top:${g.l}px;left:0;height:1.5px;width:100%`;
    ch.appendChild(d);}
}
$('#canvas').addEventListener('dblclick',ev=>{
  const ed=ev.target.closest('.el'); if(!ed)return;
  const e=card().els.find(x=>x.id===ed.dataset.id); if(!e||e.type!=='text')return;
  const t=ed.querySelector('.txt'); t.textContent=e.text;
  t.contentEditable='true'; t.focus();
  const r=document.createRange();r.selectNodeContents(t);
  getSelection().removeAllRanges();getSelection().addRange(r);
  t.onblur=()=>{e.text=t.innerText.replace(/\n$/,'');t.contentEditable='false';render();};
  t.onkeydown=k=>{if(k.key==='Escape')t.blur();k.stopPropagation();};
});
addEventListener('keydown',ev=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(document.activeElement.isContentEditable)return;
  const e=sel(); if(!e)return; const st=ev.shiftKey?10:1;
  if((ev.metaKey||ev.ctrlKey)&&e.type==='text'&&(ev.key==='ArrowUp'||ev.key==='ArrowDown')){
    ev.preventDefault(); e.size=Math.max(8,e.size+(ev.key==='ArrowUp'?1:-1)*(ev.shiftKey?10:2));
    paint($('#canvas'),card(),cur,project.cards.length);chrome();inspector();save();return;}
  const m={ArrowLeft:['x',-1],ArrowRight:['x',1],ArrowUp:['y',-1],ArrowDown:['y',1]};
  if(m[ev.key]){ev.preventDefault();e[m[ev.key][0]]+=m[ev.key][1]*st;
    paint($('#canvas'),card(),cur,project.cards.length);chrome();save();}
  if(ev.key==='Backspace'||ev.key==='Delete'){ev.preventDefault();act('delel');}
});

/* ============ 내보내기 ============ */
// 글꼴은 지연 로딩이라, 화면에 한 번도 안 쓰인 굵기는 아직 안 받았을 수 있다.
// PNG 로 굽기 전에 그 카드가 쓰는 것만 골라 실제로 받아 둔다.
async function ensureFonts(c){
  const F=project.theme.font, need=new Set([`400 16px '${F}'`,`700 16px '${F}'`]);
  for(const e of (c.els||[])) if(e.type==='text')
    need.add(`${e.weight||400} 16px '${e.font||F}'`);
  await Promise.all([...need].map(s=>document.fonts.load(s).catch(()=>{})));
}
async function shoot(c,i){
  const hold=document.createElement('div');
  hold.style.cssText=`position:fixed;left:-99999px;top:0;width:${W}px;height:${H}px`;
  const b=document.createElement('div'); b.className='canvas';
  b.style.width=W+'px'; b.style.height=H+'px'; b.style.transform='none'; b.style.margin='0';
  hold.appendChild(b); document.body.appendChild(hold);
  paint(b,c,i,project.cards.length);
  await ensureFonts(c);
  await document.fonts.ready; await new Promise(r=>setTimeout(r,110));
  const cv=await html2canvas(b,{width:W,height:H,scale:1,backgroundColor:null,useCORS:true,logging:false});
  hold.remove(); return cv.toDataURL('image/png');
}
const dl=(u,n)=>{const a=document.createElement('a');a.href=u;a.download=n;a.click();};
$('#btnPngOne').onclick=async()=>{toast('내보내는 중…');
  dl(await shoot(card(),cur),`${project.name}_${String(cur+1).padStart(2,'0')}.png`);toast('저장됨');};
$('#btnPngAll').onclick=async()=>{toast(`${project.cards.length}장 내보내는 중…`);
  for(let i=0;i<project.cards.length;i++){dl(await shoot(project.cards[i],i),
    `${project.name}_${String(i+1).padStart(2,'0')}.png`);await new Promise(r=>setTimeout(r,380));}
  toast('전체 저장됨');};
$('#btnExportJson').onclick=()=>{project.name=$('#projName').value.trim()||'제목 없는 카드뉴스';
  const b=new Blob([JSON.stringify(project,null,2)],{type:'application/json'});
  dl(URL.createObjectURL(b),`${PID||'cardnews'}.json`);
  toast(PID?`${PID}.json 저장됨 — projects/ 에 같은 이름으로 덮어 올리면 반영됩니다`
           :'JSON 저장됨 — projects/ 에 올린 뒤 ?p=파일이름 으로 여세요');};
$('#btnImport').onclick=()=>$('#jsonPick').click();
$('#jsonPick').onchange=()=>{const f=$('#jsonPick').files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(r.result);if(!p.cards)throw 0;
    project=p;project.frame=project.frame||{label:'칼럼',header:true,footer:true,logo:''};
    project.size=project.size||{w:1080,h:1080};
    cur=0;selId=null;$('#projName').value=project.name||'';render();toast('불러왔습니다');}
    catch{toast('이 파일은 카드뉴스 JSON이 아닙니다');}};
  r.readAsText(f);$('#jsonPick').value='';};
$('#btnFonts').onclick=()=>$('#fontPick').click();
$('#fontPick').onchange=async()=>{
  toast('폰트 읽는 중…');
  const n=await loadFontFiles([...$('#fontPick').files]);
  $('#fontPick').value='';
  toast(n?`${n}개 폰트 파일 적용 — ${Object.keys(loaded).join(', ')}`:'인식된 폰트가 없어요 (파일 이름에 gmarket/pretendard/paperlogy/suit/mbk 포함 필요)');
  render();
};
$('#btnAddCard').onclick=()=>{project.cards.splice(cur+1,0,preset('blank'));cur++;selId=null;render();};
$('#projName').oninput=()=>{project.name=$('#projName').value;save();};

/* ============ 프로젝트 식별 · 저장 · 불러오기 ============ */
const PID=((new URLSearchParams(location.search).get('p')||'').match(/^[\w-]{1,60}$/)||[''])[0];
const KEY='arete-cardnews:'+(PID||'_draft');
let sT=null;
function save(){clearTimeout(sT);sT=setTimeout(async()=>{
  const s=JSON.stringify(project);
  try{ if(window.storage?.set)await window.storage.set(KEY,s); else localStorage.setItem(KEY,s);}catch{}
},400);}
async function readLocal(){
  try{let s=null;
    if(window.storage?.get){const r=await window.storage.get(KEY);s=r?.value;}
    else s=localStorage.getItem(KEY);
    if(s){const p=JSON.parse(s); if(p.cards?.length)return p;}
  }catch{} return null;
}
async function getJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;return r.json();}
function migrate(p){
  p.frame=p.frame||{label:'칼럼',header:true,footer:true,logo:''};
  p.size=p.size||{w:1080,h:1080};
  p.theme=p.theme||blank().theme;
  return p;
}
function setProject(p){
  project=migrate(p); applySize();
  $('#projName').value=project.name||'';
  render();
}
function showBar(html){const b=$('#bar');b.hidden=false;b.innerHTML=html;}

async function load(){
  // file:// 로 열면 브라우저가 같은 폴더의 파일도 fetch 로 못 읽는다(보안 정책).
  // 그러면 글꼴도 편 목록도 조용히 실패해 「빈 편집기 + 엉뚱한 글꼴」이 된다.
  // 조용히 망가지느니 왜 그런지 알려준다.
  if(location.protocol==='file:'){
    showBar(`이 파일을 <b>더블클릭으로</b> 열었어요. 이렇게 열면 브라우저가 글꼴과 편 목록을
      읽지 못합니다. <b>JSON 불러오기</b> 로 편을 열 수는 있지만 글꼴은 기본 글꼴로 보입니다.
      <span class="spacer"></span>
      <button class="btn ghost" id="barFileX">알겠어요</button>`);
    $('#barFileX')?.addEventListener('click',()=>{$('#bar').hidden=true;});
  }
  await loadFontManifest();
  await initLogo();            // 로고가 준비된 뒤에 첫 렌더가 돌아야 한다
  const localP=await readLocal();
  let remoteP=null;
  if(PID){ try{ const p=await getJSON(`projects/${PID}.json`); if(p.cards?.length)remoteP=p; }catch{} }

  if(remoteP){
    setProject(remoteP);
    if(localP) showBar(`이 카드뉴스에 <b>저장소에 올리지 않은 수정본</b>이 이 브라우저에 남아 있어요.
      <span class="spacer"></span>
      <button class="btn" id="barKeep">내 수정본 이어서 편집</button>
      <button class="btn ghost" id="barDrop">저장소 버전으로 계속</button>`);
    $('#barKeep')?.addEventListener('click',()=>{setProject(localP);$('#bar').hidden=true;});
    $('#barDrop')?.addEventListener('click',()=>{$('#bar').hidden=true;});
  } else if(localP){
    setProject(localP);
    if(PID) showBar(`<b>projects/${PID}.json</b> 을 찾지 못해 이 브라우저에 남아 있던 작업을 열었어요.
      <span class="spacer"></span><button class="btn ghost" id="barX">닫기</button>`);
    $('#barX')?.addEventListener('click',()=>{$('#bar').hidden=true;});
  } else {
    setProject(project);
    await picker();
  }
}

async function picker(){
  let list=null;
  try{ const m=await getJSON('projects/index.json');
    list=(Array.isArray(m)?m:m.projects||[]).map(x=>typeof x==='string'?{id:x,title:x}:x); }catch{}
  if(!list||!list.length)return;               // 목록 파일이 없으면 그냥 빈 편집기로
  const el=$('#picker'); el.hidden=false;
  el.innerHTML=`<div class="pbox"><h2>어떤 카드뉴스를 열까요?</h2>
    <p>편집할 편을 고르세요. 주소창에 <code>?p=파일이름</code> 을 붙여도 바로 열립니다.</p>
    ${list.map(x=>`<a class="item" href="?p=${encodeURIComponent(x.id)}">${esc(x.title||x.id)}
      <small>projects/${esc(x.id)}.json</small></a>`).join('')}
    <button class="btn" style="width:100%;margin-top:8px" id="pkNew">빈 카드뉴스로 시작</button></div>`;
  $('#pkNew').onclick=()=>{el.hidden=true;};
}

$('#btnShare').onclick=async()=>{
  if(!PID)return toast('먼저 이 카드뉴스를 projects/ 에 올리고 ?p=파일이름 주소로 열어주세요');
  try{ await navigator.clipboard.writeText(location.href); toast('공유 링크를 복사했어요'); }
  catch{ toast(location.href); }
};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400);}
load();
</script>
